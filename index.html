<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Garhwali Bangers</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- BACKGROUND -->
  <div class="background"></div>

  <!-- DARK OVERLAY -->
  <div class="overlay"></div>

  <!-- FLOATING PARTICLES -->
  <div class="particles"></div>


  <!-- MAIN TITLE -->
  <main class="hero">

    <h1>
      गढ़वाली <span>BANGERS</span>
    </h1>

    <p>
      GARHWALI MUSIC • UTTARAKHAND
    </p>

  </main>


  <!-- TOP BUTTONS -->
  <div class="side-buttons">

    <button
      id="musicButton"
      class="side-btn"
      type="button"
      aria-label="Music"
    >
      🎵
    </button>

    <button
      id="fullscreenButton"
      class="side-btn"
      type="button"
      aria-label="Fullscreen"
    >
      ⛶
    </button>

  </div>


  <!-- MUSIC PLAYER -->
  <section
    id="player"
    class="player open"
  >

    <!-- LEFT SIDE -->
    <div class="player-left">

      <!-- SONG COVER -->
      <div class="cover">

        <img
          src="covers/cover.jpg"
          alt="Garhwali Bangers Cover"
        >

      </div>


      <!-- SONG INFORMATION -->
      <div class="player-info">

        <h2 id="nowTitle">
          Loading...
        </h2>

        <p id="nowArtist">
          Garhwali Bangers
        </p>


        <!-- PROGRESS -->
        <div class="progress-row">

          <span id="currentTime">
            0:00
          </span>

          <input
            type="range"
            id="progress"
            min="0"
            max="100"
            value="0"
          >

          <span id="duration">
            0:00
          </span>

        </div>

      </div>

    </div>


    <!-- MUSIC CONTROLS -->
    <div class="controls">

      <!-- PREVIOUS -->
      <button
        id="prev"
        class="control-btn"
        type="button"
        aria-label="Previous song"
      >
        ⏮
      </button>


      <!-- PLAY / PAUSE -->
      <button
        id="playPause"
        class="play-btn"
        type="button"
        aria-label="Play or pause"
      >
        ▶
      </button>


      <!-- NEXT -->
      <button
        id="next"
        class="control-btn"
        type="button"
        aria-label="Next song"
      >
        ⏭
      </button>

    </div>

  </section>


  <!-- AUDIO -->
  <audio
    id="audio"
    preload="metadata"
  ></audio>


  <!-- JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
