<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Garhwali Bangers</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- BACKGROUND -->
  <div class="background"></div>
  <div class="overlay"></div>


  <!-- MAIN TITLE -->
  <main class="hero">

    <h1>
      <span>गढ़वाली</span>
      BANGERS
    </h1>

    <p>Garhwali Music • Uttarakhand</p>

  </main>


  <!-- SIDE BUTTONS -->

  <div class="side-buttons">

    <!-- MUSIC PLAYER SHOW/HIDE -->
    <button id="musicButton" class="side-btn" title="Music">
      🎵
    </button>

    <!-- FULLSCREEN -->
    <button id="fullscreenButton" class="side-btn" title="Fullscreen">
      ⛶
    </button>

  </div>


  <!-- MUSIC PLAYER -->

  <section id="player" class="player open">

    <div class="player-left">

      <div class="cover">
        <img
          id="coverImage"
          src="covers/cover.jpg"
          alt="Song Cover"
        />
      </div>

      <div class="player-info">

        <h2 id="nowTitle">
          Garhwali Bangers
        </h2>

        <p id="nowArtist">
          Garhwali Bangers
        </p>

        <div class="time-row">

          <span id="currentTime">0:00</span>

          <input
            type="range"
            id="progress"
            min="0"
            max="100"
            value="0"
          />

          <span id="duration">0:00</span>

        </div>

      </div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

      <button id="prev" class="control-btn">
        ⏮
      </button>

      <button id="playPause" class="play-btn">
        ▶
      </button>

      <button id="next" class="control-btn">
        ⏭
      </button>

    </div>

  </section>


  <audio id="audio"></audio>

  <script src="script.js"></script>

</body>
</html>
