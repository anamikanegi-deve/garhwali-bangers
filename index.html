<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Garhwali Bangers</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background"></div>
  <div class="overlay"></div>

  <main class="hero">
    <h1>गढ़वाली <span>BANGERS</span></h1>
    <p>GARHWALI MUSIC • UTTARAKHAND</p>
  </main>

  <!-- RIGHT SIDE BUTTONS -->
  <div class="side-buttons">

    <button id="musicButton" class="side-btn" type="button">
      🎵
    </button>

    <button id="fullscreenButton" class="side-btn" type="button">
      ⛶
    </button>

  </div>


  <!-- MUSIC PLAYER -->
  <section id="player" class="player open">

    <div class="player-left">

      <div class="cover">
        🎵
      </div>

      <div class="player-info">

        <h2 id="nowTitle">Loading...</h2>

        <p id="nowArtist">Garhwali Bangers</p>

        <div class="progress-row">

          <span id="currentTime">0:00</span>

          <input
            type="range"
            id="progress"
            min="0"
            max="100"
            value="0"
          >

          <span id="duration">0:00</span>

        </div>

      </div>

    </div>


    <div class="controls">

      <button id="prev" class="control-btn" type="button">
        ⏮
      </button>

      <button id="playPause" class="play-btn" type="button">
        ▶
      </button>

      <button id="next" class="control-btn" type="button">
        ⏭
      </button>

    </div>

  </section>


  <!-- AUDIO -->
  <audio id="audio" preload="metadata"></audio>


  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
