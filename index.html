<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Garhwali Bangers</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="overlay"></div>

  <!-- TOP RIGHT BUTTONS -->
  <div class="top-actions">

    <a
      href="https://www.instagram.com/vibee_coder?igsh=MWU3b2p5eXJ0N3U1dg=="
      target="_blank"
      class="top-action instagram-btn"
      title="Instagram"
    >
      ◎
    </a>

    <button
      id="fullscreenBtn"
      class="top-action"
      title="Full Screen"
    >
      ⛶
    </button>

  </div>


  <main class="app">

    <header>

      <!-- PEOPLE ONLINE -->
      <div class="online-status">
        <span class="online-dot"></span>
        <span id="onlineCount">233</span> people online
      </div>

      <p class="eyebrow">🏔️ PAHADI VIBES</p>

      <h1>Garhwali <span>Bangers</span></h1>

      <p class="sub">Your Garhwali music corner</p>

    </header>


    <!-- CURRENT SONG -->
    <section class="hero">

      <!-- PURANA HERO ICON SAME -->
      <div class="hero-art">
        🏔️
        <small>GARHWAL</small>
      </div>

      <div>
        <h2 id="nowTitle">Loading...</h2>

        <p id="nowArtist">
          Garhwali Bangers
        </p>
      </div>

    </section>


    <!-- SONGS -->
    <section class="songs-section">

      <div class="section-title">
        <h2>🎵 Songs</h2>

        <span id="songCount">
          0 songs
        </span>
      </div>

      <div
        id="songList"
        class="song-list"
      ></div>

      <p
        id="empty"
        class="empty"
      >
        No songs found.
      </p>

    </section>

  </main>


  <!-- BOTTOM MUSIC BUTTON -->
  <div class="music-button-wrap">

    <button
      id="musicButton"
      class="music-button"
    >
      ♫
    </button>

    <span class="now-playing-text">
      NOW PLAYING
    </span>

  </div>


  <!-- MUSIC PLAYER -->
  <div
    id="player"
    class="player"
  >

    <div class="player-top">

      <div>
        <p class="now-label">
          PLAYING
        </p>

        <h3 id="playerTitle">
          Loading...
        </h3>
      </div>

      <button
        id="closePlayer"
        class="close"
      >
        ×
      </button>

    </div>


    <!-- PROGRESS -->
    <input
      id="progress"
      type="range"
      min="0"
      max="100"
      value="0"
    >


    <div class="times">

      <span id="currentTime">
        0:00
      </span>

      <span id="duration">
        0:00
      </span>

    </div>


    <!-- CONTROLS -->
    <div class="controls">

      <button id="prev">
        ⏮
      </button>

      <button
        id="playPause"
        class="main-control"
      >
        ▶
      </button>

      <button id="next">
        ⏭
      </button>

    </div>

  </div>


  <audio id="audio"></audio>

  <script src="script.js"></script>

</body>
