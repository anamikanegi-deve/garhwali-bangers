<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Garhwali Bangers</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="overlay"></div>

  <main class="app">

    <header>

      <p class="eyebrow">
        🏔️ PAHADI VIBES
      </p>

      <h1>
        Garhwali
        <span>Bangers</span>
      </h1>

      <p class="sub">
        Your Garhwali music corner
      </p>

    </header>


    <!-- NOW PLAYING -->

    <section class="hero">

      <div class="hero-art">
        🏔️
        <small>GARHWAL</small>
      </div>

      <div>

        <h2 id="nowTitle">
          Gajna
        </h2>

        <p id="nowArtist">
          Garhwali Bangers
        </p>

      </div>

    </section>


    <!-- SONGS -->

    <section class="songs-section">

      <div class="section-title">

        <h2>
          🎵 Songs
        </h2>

        <span id="songCount">
          0 songs
        </span>

      </div>


      <div
        id="songList"
        class="song-list"
      ></div>


      <p
        id="empty"
        class="empty"
      >
        Songs will appear here.
      </p>

    </section>

  </main>


  <!-- MUSIC BUTTON -->

  <div class="music-wrapper">

    <button
      id="musicButton"
      class="music-button"
    >
      ♫
    </button>

    <span class="music-label">
      NOW PLAYING
    </span>

  </div>


  <!-- MUSIC PLAYER -->

  <div
    id="player"
    class="player"
  >

    <div class="player-top">

      <div>

        <p class="now-label">
          PLAYING
        </p>

        <h3 id="playerTitle">
          Gajna
        </h3>

      </div>


      <button
        id="closePlayer"
        class="close"
      >
        ×
      </button>

    </div>


    <input
      id="progress"
      type="range"
      min="0"
      max="100"
      value="0"
    >


    <div class="times">

      <span id="currentTime">
        0:00
      </span>

      <span id="duration">
        0:00
      </span>

    </div>


    <div class="controls">

      <button id="prev">
        ⏮
      </button>

      <button
        id="playPause"
        class="main-control"
      >
        ▶
      </button>

      <button id="next">
        ⏭
      </button>

    </div>

  </div>


  <audio id="audio"></audio>

  <script src="script.js"></script>

</body>
</html>
